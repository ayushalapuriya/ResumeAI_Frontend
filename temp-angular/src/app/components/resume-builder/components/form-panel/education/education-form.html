<div class="form-section">

  <div class="sec-header">
    <div class="sec-header-icon" [style.background]="accentColor + '18'" [style.color]="accentColor">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div>
      <h2 class="sec-title">Education</h2>
      <p class="sec-sub">Your academic background</p>
    </div>
  </div>

  <div class="entry-card" *ngFor="let edu of items; let i = index">
    <div class="entry-card-header">
      <div
        class="entry-card-index"
        [style.background]="accentColor + '18'"
        [style.color]="accentColor"
      >{{ i + 1 }}</div>
      <span class="entry-card-label">{{ edu.institution || 'New Education' }}</span>
      <button class="btn-remove" (click)="removeItem.emit(edu.id)" aria-label="Remove education">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="field-grid">
      <div class="field">
        <label>Institution</label>
        <input type="text" [(ngModel)]="edu.institution" placeholder="University Name" />
      </div>
      <div class="field">
        <label>Degree</label>
        <input type="text" [(ngModel)]="edu.degree" placeholder="B.Sc. / B.E." />
      </div>
      <div class="field">
        <label>Field of Study</label>
        <input type="text" [(ngModel)]="edu.field" placeholder="Computer Science" />
      </div>
      <div class="field">
        <label>Graduation Year</label>
        <input type="text" [(ngModel)]="edu.year" placeholder="2024" />
      </div>
    </div>
  </div>

  <button
    class="btn-add-entry"
    (click)="addItem.emit()"
    [style.color]="accentColor"
    [style.border-color]="accentColor + '44'"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Add Education
  </button>

</div>

<div class="form-section">

  <!-- Section header -->
  <div class="sec-header">
    <div class="sec-header-icon" [style.background]="accentColor + '18'" [style.color]="accentColor">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <div>
      <h2 class="sec-title">Personal Information</h2>
      <p class="sec-sub">Appears at the top of your resume</p>
    </div>
  </div>

  <!-- Fields -->
  <div class="field-grid">
    <div class="field">
      <label>Full Name <span class="req">*</span></label>
      <input type="text" [(ngModel)]="resume.fullName" placeholder="Alex Johnson" />
    </div>

    <div class="field">
      <label>Job Title</label>
      <input type="text" [(ngModel)]="resume.jobTitle" placeholder="Product Designer" />
    </div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" [(ngModel)]="resume.email" placeholder="you@email.com" />
    </div>

    <div class="field">
      <label>Phone Number</label>
      <input type="text" [(ngModel)]="resume.phone" placeholder="999-999-9999" />
    </div>

    <div class="field">
      <label>Location</label>
      <input type="text" [(ngModel)]="resume.location" placeholder="City, State / Country" />
    </div>

    <div class="field">
      <label>Website</label>
      <input type="text" [(ngModel)]="resume.website" placeholder="yoursite.com" />
    </div>

    <div class="field">
      <label>LinkedIn</label>
      <input type="text" [(ngModel)]="resume.linkedin" placeholder="linkedin.com/in/yourname" />
    </div>
  </div>

</div>

<aside class="dash-sidebar">
  <div class="dash-logo">
    <span class="logo-mark">R</span>
    <span class="logo-name">Resume<strong>AI</strong></span>
  </div>

  <nav class="dash-nav">
    <button class="dash-nav-item" [class.active]="activePage === 'resume'" (click)="setPage('resume')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
      </svg>
      My Resume
    </button>
    <button class="dash-nav-item" [class.active]="activePage === 'templates'" (click)="setPage('templates')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      Templates
    </button>
  </nav>

  <!-- User block -->
  <div class="dash-user-block" (click)="toggleUserMenu()">
    <div class="dash-avatar">{{ userInitials }}</div>
    <div class="dash-user-info">
      <span class="dash-user-name">{{ user?.email || 'Guest' }}</span>
      <span class="dash-user-role">{{ userRole }}</span>
    </div>
    <svg class="dash-user-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="6,9 12,15 18,9"/>
    </svg>

    <div class="user-dropdown" [class.open]="userMenuOpen()">
      <button class="user-drop-item" (click)="goToProfile($event)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        View Profile
      </button>
      <div class="drop-divider"></div>
      <button class="user-drop-item danger" (click)="onLogout($event)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Log Out
      </button>
    </div>
  </div>
</aside>

<div
  class="resume-card"
  [class.active-resume]="resume.active"
  (mouseenter)="hovered = true"
  (mouseleave)="hovered = false"
>
  <div class="resume-card-bar" [style.background]="resume.color"></div>

  <div class="resume-card-preview">
    <div class="rmock-header" [style.background]="resume.color">
      <div class="rmock-name-line"></div>
      <div class="rmock-title-line"></div>
    </div>
    <div class="rmock-body">
      <div class="rmock-section" *ngFor="let s of [1,2,3]">
        <div class="rmock-sec-head" [style.background]="resume.color + '55'"></div>
        <div class="rmock-line wide"></div>
        <div class="rmock-line mid"></div>
        <div class="rmock-line short"></div>
      </div>
    </div>
  </div>

  <div class="resume-card-info">
    <div class="resume-card-meta">
      <div>
        <p class="resume-card-name">{{ resume.name }}</p>
        <p class="resume-card-date">Updated {{ resume.updated }}</p>
      </div>
      <span class="resume-active-badge" *ngIf="resume.active">Active</span>
    </div>

    <div class="resume-progress-row">
      <span class="resume-progress-label">{{ resume.completeness }}% complete</span>
      <div class="resume-progress-track">
        <div class="resume-progress-fill"
          [style.width]="resume.completeness + '%'"
          [style.background]="resume.color">
        </div>
      </div>
    </div>

    <div class="resume-card-actions">
      <button class="btn-edit" [style.background]="resume.color" (click)="edit.emit(resume)">Edit</button>

      <button class="btn-icon-action" title="Download" (click)="download.emit(resume)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7,10 12,15 17,10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>

      <button class="btn-icon-action" title="Duplicate" (click)="duplicate.emit(resume)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>

      <button class="btn-icon-action danger" title="Delete" (click)="delete.emit(resume)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3,6 5,6 21,6"/>
          <path d="M19,6l-1,14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5,6"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay" [class.show]="open" (click)="onOverlayClick()">
  <div class="preview-modal" (click)="onModalClick($event)">

    <!-- Header -->
    <div class="preview-modal-header">
      <div class="preview-modal-title-row">
        <div class="preview-modal-icon" [style.background]="accent + '18'" [style.color]="accent">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
        </div>
        <div>
          <span class="preview-modal-title">{{ template?.name }}</span>
          <span class="preview-modal-cat">{{ template?.category }}</span>
        </div>
      </div>
      <button class="preview-modal-close" (click)="close.emit()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body: Image OR Live HTML/CSS preview -->
    <div class="preview-modal-body" *ngIf="template">

      <!-- IMAGE preview (when thumbnailUrl exists) -->
      <div class="preview-image-wrap" *ngIf="hasImage">
        <img
          [src]="template!.thumbnailUrl"
          [alt]="template!.name + ' preview'"
          class="preview-image"
          (error)="template!.thumbnailUrl = ''"
        />
      </div>

      <!-- LIVE HTML/CSS preview (iframe-like, rendered in shadow) -->
      <div class="preview-live-wrap" *ngIf="!hasImage">
        <div class="preview-live-scaler">
          <div class="preview-live-content" [innerHTML]="livePreviewHtml"></div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="preview-modal-footer">
      <div class="preview-footer-meta" *ngIf="template">
        <span class="preview-meta-uses">{{ template.usageCount | number }} uses</span>
        <span class="preview-meta-badge premium" *ngIf="template.isPremium">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          PRO
        </span>
      </div>
      <button class="btn-use-tpl" [style.background]="accent" (click)="template && use.emit(template)">
        Use This Template
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12,5 19,12 12,19"/>
        </svg>
      </button>
    </div>

  </div>
</div>

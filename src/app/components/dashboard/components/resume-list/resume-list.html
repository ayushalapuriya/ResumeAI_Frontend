<div class="dash-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">My Resumes</h1>
      <p class="page-sub">Manage and edit your resume documents</p>
    </div>
    <button class="btn-new" (click)="createNew.emit()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Resume
    </button>
  </div>

  <app-score-banner [score]="score" (browseTemplates)="browseTemplates.emit()"></app-score-banner>

  <div class="resume-cards-grid">
    <app-resume-card
      *ngFor="let r of resumes"
      [resume]="r"
      (edit)="editResume.emit($event)"
      (download)="downloadResume.emit($event)"
      (duplicate)="duplicateResume.emit($event)"
      (delete)="deleteResume.emit($event)"
    ></app-resume-card>

    <button class="resume-card-new" (click)="createNew.emit()">
      <div class="new-card-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <p class="new-card-label">Create New Resume</p>
      <p class="new-card-sub">Start from scratch or a template</p>
    </button>
  </div>

  <div class="skills-snapshot">
    <h3 class="snapshot-title">Skills on Active Resume</h3>
    <div class="snapshot-chips">
      <span
        class="snap-chip"
        *ngFor="let sk of activeSkills"
        [style.background]="sk.bg"
        [style.color]="sk.color"
        [style.border-color]="sk.border"
      >{{ sk.name }}</span>
    </div>
  </div>
</div>

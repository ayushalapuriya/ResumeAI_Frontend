<div class="toast-wrap"
     [class.show]="state.visible"
     [class.toast-success]="state.type === 'success'"
     [class.toast-error]="state.type === 'error'"
     [class.toast-loading]="state.type === 'loading'"
     [class.toast-info]="state.type === 'info'">

  <!-- Success icon -->
  <svg *ngIf="state.type === 'success'" width="14" height="14" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="20,6 9,17 4,12"/>
  </svg>

  <!-- Error icon -->
  <svg *ngIf="state.type === 'error'" width="14" height="14" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>

  <!-- Loading spinner -->
  <span *ngIf="state.type === 'loading'" class="toast-spinner"></span>

  <!-- Info icon -->
  <svg *ngIf="state.type === 'info'" width="14" height="14" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="16" x2="12" y2="12"/>
    <line x1="12" y1="8" x2="12.01" y2="8"/>
  </svg>

  {{ state.message }}
</div>

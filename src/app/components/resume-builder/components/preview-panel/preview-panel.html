<div class="preview-panel">

  <!-- Panel top bar -->
  <div class="preview-topbar">
    <div class="preview-label-row">
      <span class="preview-dot live"></span>
      <span class="preview-label">Live Preview</span>
    </div>

    <div class="preview-topbar-actions">
      <button class="btn-preview-action" (click)="exportPdf.emit()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7,10 12,15 17,10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        PDF
      </button>
    </div>
  </div>

  <!-- Resume paper -->
  <div class="preview-sheet-wrap">
    <div class="preview-paper">
      <div class="preview-paper-inner" [innerHTML]="previewHtml"></div>
    </div>
  </div>

</div>

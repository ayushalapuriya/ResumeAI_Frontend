<div class="form-panel">
  <div class="form-scroll">

    <app-personal-info-form
      *ngIf="activeSection === 'personal'"
      [resume]="resume"
      [accentColor]="accentColor"
    />

    <app-summary-form
      *ngIf="activeSection === 'summary'"
      [resume]="resume"
      [accentColor]="accentColor"
    />

    <app-experience-form
      *ngIf="activeSection === 'experience'"
      [items]="resume.experience"
      [accentColor]="accentColor"
      (addItem)="addExperience.emit()"
      (removeItem)="removeExperience.emit($event)"
    />

    <app-education-form
      *ngIf="activeSection === 'education'"
      [items]="resume.education"
      [accentColor]="accentColor"
      (addItem)="addEducation.emit()"
      (removeItem)="removeEducation.emit($event)"
    />

    <app-projects-form
      *ngIf="activeSection === 'projects'"
      [items]="resume.projects"
      [accentColor]="accentColor"
      (addItem)="addProject.emit()"
      (removeItem)="removeProject.emit($event)"
    />

    <app-skills-form
      *ngIf="activeSection === 'skills'"
      [skills]="resume.skills"
      [jobTitle]="resume.jobTitle"
      [accentColor]="accentColor"
      (addSkill)="addSkill.emit($event)"
      (removeSkill)="removeSkill.emit($event)"
    />

  </div>
</div>

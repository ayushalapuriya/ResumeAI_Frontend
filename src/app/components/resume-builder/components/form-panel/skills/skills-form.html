<div class="form-section">

  <div class="sec-header">
    <div class="sec-header-icon" [style.background]="accentColor + '18'" [style.color]="accentColor">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>
      </svg>
    </div>
    <div>
      <h2 class="sec-title">Skills</h2>
      <p class="sec-sub">Press Enter or click Add after each skill</p>
    </div>
    <button class="btn-ai" style="margin-left:auto; flex-shrink:0"
            (click)="onSuggestSkills()" [disabled]="aiLoading()">
      <span *ngIf="aiLoading()" class="ai-spin">⟳</span>
      <span *ngIf="!aiLoading()">✦</span>
      {{ aiLoading() ? 'Suggesting…' : 'Suggest Skills' }}
    </button>
  </div>

  <!-- Input row -->
  <div class="skill-input-row">
    <input type="text" class="skill-input" [(ngModel)]="newSkill"
           (keydown)="onKeydown($event)"
           placeholder="e.g. JavaScript, Docker, Project Management…" />
    <button class="btn-add-skill" [style.background]="accentColor" (click)="onAddClicked()">Add</button>
  </div>

  <!-- AI suggestions panel -->
  <div class="ai-panel" *ngIf="aiSuggestions().length > 0">
    <div class="ai-panel-header">
      <span class="ai-panel-title">✦ AI Skill Suggestions — click to add</span>
      <div class="ai-panel-actions">
        <button class="btn-ai-action" (click)="dismissSuggestions()">Dismiss</button>
      </div>
    </div>
    <div class="ai-skill-chips">
      <button class="ai-skill-chip" *ngFor="let s of aiSuggestions()"
              [class.added]="isAdded(s)"
              (click)="addSuggestion(s)"
              [disabled]="isAdded(s)">
        <span *ngIf="!isAdded(s)">+</span>
        <span *ngIf="isAdded(s)">✓</span>
        {{ s }}
      </button>
    </div>
  </div>

  <!-- Skills cloud -->
  <div class="skills-cloud">
    <div class="skill-chip" *ngFor="let skill of skills"
         [style.background]="accentColor + '12'"
         [style.border-color]="accentColor + '35'"
         [style.color]="accentColor">
      {{ skill }}
      <button class="chip-remove" (click)="removeSkill.emit(skill)" aria-label="Remove skill">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <p class="skills-tip" *ngIf="skills.length === 0">
    No skills added yet — type one above and press Enter, or use AI suggestions.
  </p>

</div>
